<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatMovie - Trouve quoi regarder ce soir</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="dynamic-bg" id="dynamic-bg"></div>

  <header>
    <div class="header-top">
      <h1>WhatMovie</h1>
      <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()">Mode Clair</button>
    </div>
    <p>Trouve quoi regarder ce soir</p>
  </header>

  <nav class="nav-bar">
    <button class="nav-btn active" id="btn-tab-discover" onclick="switchTab('discover')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Découvrir</span>
    </button>
    <button class="nav-btn" id="btn-tab-trends" onclick="switchTab('trends')">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      <span>Tendances</span>
    </button>
    <button class="nav-btn" id="btn-tab-favorites" onclick="switchTab('favorites')">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span>Favoris</span>
    </button>
    <button class="nav-btn" id="btn-tab-history" onclick="switchTab('history')">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7.07 7.07 0 0 1-6-3.39l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8z"/></svg>
      <span>Historique</span>
    </button>
  </nav>

  <main class="content-container">
    <!-- ONGLET DÉCOUVRIR -->
    <div id="tab-discover" class="tab-content active">
      <div class="search-bar-container">
        <div class="search-input-wrapper">
          <input type="text" id="search-input" placeholder="Rechercher un film précis..." oninput="handleSearchInput(this.value)">
          <div id="search-dropdown" class="search-dropdown"></div>
        </div>
        <button class="btn-action" onclick="searchMovie()">Rechercher</button>
      </div>

      <div class="controls">
        <select id="filter-genre" onchange="fetchNextMovie()">
          <option value="">Tous les genres</option>
        </select>
        <select id="filter-era" onchange="fetchNextMovie()">
          <option value="">Toutes les époques</option>
          <option value="2020s">Années 2020</option>
          <option value="2010s">Années 2010</option>
          <option value="2000s">Années 2000</option>
          <option value="classic">Classiques (&lt; 2000)</option>
        </select>
        <select id="filter-duration" onchange="fetchNextMovie()">
          <option value="">Toutes les durées</option>
          <option value="short">Moins d'1h30</option>
          <option value="medium">1h30 à 2h</option>
          <option value="long">Plus de 2h</option>
        </select>
        <button class="btn-primary" onclick="fetchNextMovie()">Proposer un film</button>
      </div>

      <div class="provider-filters">
        <button class="provider-btn" data-provider="8" onclick="toggleProvider(this)">
          <img src="https://image.tmdb.org/t/p/original/pbpMk121StL1M3vR312pG3A22R0.jpg" alt="Netflix"> Netflix
        </button>
        <button class="provider-btn" data-provider="119" onclick="toggleProvider(this)">
          <img src="https://image.tmdb.org/t/p/original/dQeAar5H9P23wqK4S2B33A22R0.jpg" alt="Prime Video"> Prime
        </button>
        <button class="provider-btn" data-provider="337" onclick="toggleProvider(this)">
          <img src="https://image.tmdb.org/t/p/original/97yT1WRA4S2B33A22R0.jpg" alt="Disney+"> Disney+
        </button>
      </div>

      <div class="movie-card-wrapper">
        <div id="movie-card" class="glass-card">
          <div class="poster-container">
            <img id="movie-poster" src="" alt="Affiche du film">
          </div>
          <div class="details-container">
            <div class="title-row">
              <h2 id="movie-title">Titre du film</h2>
              <button id="btn-fav" class="btn-fav" onclick="toggleFavoriteCurrent()">Ajouter aux favoris</button>
            </div>
            <div id="movie-tags" class="tags"></div>
            <p id="movie-synopsis" class="synopsis">Synopsis du film...</p>
            
            <div class="providers-section">
              <span>Disponible sur :</span>
              <div id="movie-providers" class="logos-container"></div>
            </div>

            <div class="credits-section">
              <div id="movie-director" class="director-info"></div>
              <div id="movie-cast" class="cast-container"></div>
            </div>

            <div class="actions-section">
              <div class="rating-section">
                <span>Note TMDB :</span>
                <span id="movie-rating" class="stars">0 / 10</span>
              </div>
              <button class="btn-action" id="btn-trailer" onclick="openTrailer()">Bande-annonce</button>
              <button class="btn-primary" onclick="markCurrentAsWatched()">Déjà vu (suivant)</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ONGLET TENDANCES -->
    <div id="tab-trends" class="tab-content">
      <h2>Tendances du moment</h2>
      <div id="trends-grid" class="favorites-grid"></div>
    </div>

    <!-- ONGLET FAVORIS -->
    <div id="tab-favorites" class="tab-content">
      <h2>Mes Favoris</h2>
      <div id="favorites-grid" class="favorites-grid"></div>
    </div>

    <!-- ONGLET HISTORIQUE & STATS -->
    <div id="tab-history" class="tab-content">
      <div class="stats-container">
        <div class="stat-card">
          <h3>Films visionnés</h3>
          <div id="stat-count" class="stat-value">0</div>
        </div>
        <div class="stat-card">
          <h3>Temps de visionnage</h3>
          <div id="stat-time" class="stat-value">0h</div>
        </div>
      </div>

      <div class="stat-card" style="margin-bottom: 24px;">
        <h3>Genres préférés</h3>
        <div id="genre-stats" class="genre-bar-container"></div>
      </div>

      <h2>Films déjà vus</h2>
      <div id="history-grid" class="favorites-grid"></div>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker enregistré !'))
          .catch((err) => console.log('Erreur SW :', err));
      });
    }
  </script>
</body>
</html>

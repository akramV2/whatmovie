<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://akramv2.github.io/whatmovie/">
    <meta property="og:title" content="WhatMovie - Trouve quoi regarder ce soir">
    <meta property="og:description" content="Application fluide pour découvrir des films sur vos plateformes de streaming.">
    <meta property="og:image" content="https://akramv2.github.io/whatmovie/og-image.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="WhatMovie - Trouve quoi regarder ce soir">
    <meta name="twitter:description" content="Application fluide pour découvrir des films sur vos plateformes de streaming.">
    <meta name="twitter:image" content="https://akramv2.github.io/whatmovie/og-image.png">
  <title>WhatMovie - Trouve quoi regarder ce soir</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="dynamic-bg" class="dynamic-bg"></div>
  <div id="toast-container" class="toast-container"></div>

  <header>
    <div class="header-top">
      <h1>WhatMovie</h1>
      <button id="theme-toggle" class="btn-icon">Mode Clair</button>
    </div>
    <p>Trouve quoi regarder ce soir</p>
  </header>

  <!-- Navigation principale -->
  <nav class="nav-bar">
    <button class="nav-btn active" data-target="tab-discover">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Découvrir</span>
    </button>
    <button class="nav-btn" data-target="tab-trending">
      <svg viewBox="0 0 24 24"><path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
      <span>Tendances</span>
    </button>
    <button class="nav-btn" data-target="tab-favorites">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span>Favoris</span>
    </button>
  </nav>

  <main class="content-container">
    <!-- Onglet 1 : Découvrir -->
    <section id="tab-discover" class="tab-content active">
      <div class="search-bar-container">
        <div class="search-input-wrapper">
          <input type="text" id="search-input" placeholder="Rechercher un film précis..." autocomplete="off">
          <div id="search-results-dropdown" class="search-dropdown"></div>
        </div>
        <button id="search-btn" class="btn-action">Rechercher</button>
      </div>

      <div class="controls">
        <select id="genre-select"><option value="">Tous les genres</option></select>
        <select id="era-select">
          <option value="">Toutes les époques</option>
          <option value="2020-2026">Années 2020+</option>
          <option value="2010-2019">Années 2010</option>
          <option value="2000-2009">Années 2000</option>
          <option value="1990-1999">Années 90</option>
          <option value="1980-1989">Années 80</option>
          <option value="1970-1979">Anciens (&lt; 1980)</option>
        </select>
        <select id="duration-select">
          <option value="">Toutes les durées</option>
          <option value="short">Court (&lt; 1h30)</option>
          <option value="medium">Standard (1h30 - 2h)</option>
          <option value="long">Long (&gt; 2h)</option>
        </select>
        <select id="provider-select">
          <option value="">Toutes les plateformes</option>
          <option value="8">Netflix</option>
          <option value="119">Prime Video</option>
          <option value="337">Disney+</option>
          <option value="381">Canal+</option>
          <option value="2">Apple TV</option>
        </select>
        <button id="propose-btn" class="btn-primary">Proposer un film</button>
      </div>

      <div class="movie-card-wrapper">
        <div id="spinner" class="spinner" style="display: none;"></div>
        <div id="movie-card" class="movie-card glass-card">
          <div class="poster-container" id="poster-container">
            <img id="movie-poster" src="" alt="Affiche du film" loading="eager">
          </div>
          <div class="details-container">
            <div class="title-row">
              <h2 id="movie-title">Titre du film</h2>
              <button id="fav-btn" class="btn-fav">Ajouter aux favoris</button>
            </div>
            <div class="tags" id="movie-genres"></div>
            <div class="providers-section">
              <span>Disponible sur :</span>
              <div id="movie-providers" class="logos-container"></div>
            </div>
            <p id="movie-synopsis" class="synopsis">Synopsis du film...</p>
            <div class="credits-section">
              <p id="movie-director" class="director-info"></p>
              <div id="movie-cast" class="cast-container"></div>
            </div>
            <div class="actions-section">
              <button id="trailer-btn" class="btn-action">Bande-annonce</button>
              <button id="share-btn" class="btn-action">Partager</button>
            </div>
            <div class="rating-section">
              <div>Note TMDB : <span id="movie-rating" class="stars">0 / 10</span></div>
              <button id="next-btn" class="btn-primary">Déjà vu (suivant)</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Onglet 2 : Tendances -->
    <section id="tab-trending" class="tab-content">
      <h2 class="section-title">Films Tendances du Moment</h2>
      <div id="trending-grid" class="favorites-grid"></div>
    </section>

    <!-- Onglet 3 : Favoris -->
    <section id="tab-favorites" class="tab-content">
      <div class="favorites-header">
        <h3 id="fav-count-title">Mes Favoris (0)</h3>
      </div>
      <div id="favorites-grid" class="favorites-grid"></div>
    </section>
  </main>

  <div id="modal" class="modal">
    <div class="modal-wrapper">
      <span id="modal-close" class="modal-close">&times;</span>
      <div id="modal-content-container"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
